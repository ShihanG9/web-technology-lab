<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Netflix Style Navbar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background-color: #141414;
        }

        .navbar {
            position: fixed;
            top: 0;
            width: 100%;
            height: 70px;
            background-color: rgba(0, 0, 0, 0.85);
            display: flex;
            align-items: center;
            padding: 0 50px;
            z-index: 1000;
        }

        .logo {
            color: #e50914;
            font-size: 28px;
            font-weight: bold;
            margin-right: 40px;
            cursor: pointer;
        }

        .nav-links {
            display: flex;
            gap: 25px;
        }

        .nav-links a {
            text-decoration: none;
            color: white;
            font-size: 15px;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: #b3b3b3;
        }

        .nav-right {
            margin-left: auto;
            display: flex;
            gap: 20px;
            color: white;
            font-size: 14px;
        }

        .nav-right span {
            cursor: pointer;
        }
        @media (max-width: 768px) {
            .navbar {
                padding: 0 20px;
            }

            .nav-links {
                gap: 15px;
            }

            .nav-links a {
                font-size: 13px;
            }
        }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="logo">NETFLIX</div>

        <div class="nav-links">
            <a href="#">Home</a>
            <a href="#">Shows</a>
            <a href="#">Movies</a>
            <a href="#">Games</a>
            <a href="#">New & Popular</a>
            <a href="#">My List</a>
            <a href="#">Browse by Languages</a>
        </div>

        <div class="nav-right">
            <span>🔍</span>
            <span>👤</span>
        </div>
    </div>

</body>
</html>
