<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Input Form</title>

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body{
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .container{
            width: 400px;
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
            color: white;
            animation: fadeIn 1s ease;
        }

        @keyframes fadeIn{
            from{
                opacity: 0;
                transform: translateY(20px);
            }
            to{
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1{
            text-align: center;
            margin-bottom: 25px;
            font-size: 30px;
        }

        .input-group{
            margin-bottom: 18px;
        }

        label{
            display: block;
            margin-bottom: 8px;
            font-size: 16px;
        }

        input{
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
            transition: 0.3s;
        }

        input:focus{
            transform: scale(1.03);
            box-shadow: 0 0 10px rgba(255,255,255,0.7);
        }

        button{
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: white;
            color: #764ba2;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover{
            transform: scale(1.05);
            background: #f1f1f1;
        }

        #output{
            margin-top: 20px;
            padding: 15px;
            border-radius: 12px;
            background: rgba(255,255,255,0.2);
            text-align: center;
            font-size: 17px;
            display: none;
        }

    </style>
</head>

<body>

    <div class="container">

        <h1>📝 User Form</h1>

        <div class="input-group">
            <label>Full Name</label>
            <input type="text" id="name" placeholder="Enter your name">
        </div>

        <div class="input-group">
            <label>Email</label>
            <input type="email" id="email" placeholder="Enter your email">
        </div>

        <div class="input-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="Enter password">
        </div>

        <button onclick="submitData()">
            Submit
        </button>

        <div id="output"></div>

    </div>

    <script>

        function submitData(){

            let name =
            document.getElementById("name").value;

            let email =
            document.getElementById("email").value;

            let password =
            document.getElementById("password").value;

            let output =
            document.getElementById("output");

            if(name === "" || email === "" || password === ""){

                output.style.display = "block";

                output.innerHTML =
                "⚠️ Please fill all fields!";
            }

            else{

                output.style.display = "block";

                output.innerHTML =
                "✅ Data Submitted Successfully!<br><br>" +
                "👤 Name: " + name + "<br>" +
                "📧 Email: " + email;
            }
        }

    </script>

</body>
</html>
